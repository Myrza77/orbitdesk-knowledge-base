<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Scorecard — demo (drill-down into shared analysis panel)</title>
<style>
  :root{
    --accent:#5B4FE5;
    --accent-soft:#F1EEFF;
    --accent-soft-border:#DCD4FF;
    --ok:#16A34A; --ok-bg:#ECFDF3;
    --warn:#D97706; --warn-bg:#FFFBEB;
    --bad:#DC2626; --bad-bg:#FEF2F2;
    --div:#7C3AED; --div-bg:#F3EBFF; --div-border:#DFC9FF;
    --muted:#9CA3AF; --muted-bg:#F3F4F6;
    --text:#111827; --text2:#6B7280; --text3:#9CA3AF;
    --border:#E5E7EB; --bg-side:#F8F8FB; --bg:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text); background:var(--bg); font-size:13.5px; line-height:1.5;}
  .app{display:flex; flex-direction:column; min-height:100vh;}
  .topbar{display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap; flex:none;}
  .topbar h1{font-size:16px; margin:0; font-weight:700; white-space:nowrap;}
  .topbar .sub{color:var(--text2); font-size:12.5px; margin-right:auto;}
  .demo-banner{background:var(--warn-bg); color:#92600A; border:1px solid #FDE7B8; border-radius:8px; padding:4px 10px; font-size:12px; font-weight:600;}

  .col{flex:0 0 300px; width:300px; border-right:1px solid var(--border); overflow-y:auto; padding:16px; min-height:0;}
  .col.grow{flex:1 1 0; width:auto; min-width:340px;}
  .col-header{font-size:10.5px; text-transform:uppercase; color:var(--text3); font-weight:700; margin-bottom:10px; letter-spacing:.05em; display:flex; align-items:center; gap:6px;}
  .col-header .n{background:var(--accent); color:#fff; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:800;}

  .breadcrumb{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text2); margin-bottom:14px; flex-wrap:wrap;}
  .breadcrumb a{color:var(--accent); cursor:pointer; text-decoration:none; font-weight:600;}
  .breadcrumb .sep{color:var(--text3);}

  .row-item{display:flex; align-items:center; gap:8px; padding:10px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px; border:1px solid transparent;}
  .row-item:hover{background:#F5F4FF;}
  .row-item.selected{background:var(--accent-soft); border-color:var(--accent-soft-border);}
  .row-item .name{flex:1; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-item .meta{font-size:11px; color:var(--text3); flex:none;}
  .row-item.razno{border-style:dashed; border-color:var(--border); margin-top:10px; cursor:default;}
  .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .dot.ok{background:var(--ok);} .dot.warn{background:var(--warn);}
  .dot.bad{background:var(--bad);} .dot.muted{background:var(--muted);}
  .class-sub{font-size:11px; color:var(--text3); margin-top:1px;}
  .flag{font-size:10px; font-weight:800; color:var(--bad); background:var(--bad-bg); border:1px solid #FBD5D5; border-radius:6px; padding:1px 6px; flex:none;}

  .quick-switch{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:12px;}
  .qs-pill{border:1px solid var(--border); border-radius:999px; padding:4px 10px; font-size:11.5px; cursor:pointer; background:#fff;}
  .qs-pill.current{background:var(--accent); color:#fff; border-color:var(--accent);}
  .qs-pill.disabled{opacity:.45; cursor:default;}
  .qs-pill .soon{font-style:italic; font-size:10px;}

  .badges{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .badge{border-radius:8px; padding:7px 10px; font-size:11.5px; border:1px solid var(--border); flex:1; min-width:110px;}
  .badge .label{color:var(--text2); font-size:10px; display:block; margin-bottom:2px;}
  .badge .val{font-weight:700; font-size:14px;}
  .badge.ok{background:var(--ok-bg); border-color:#BBF0CE;} .badge.ok .val{color:var(--ok);}
  .badge.warn{background:var(--warn-bg); border-color:#FDE7B8;} .badge.warn .val{color:var(--warn);}
  .badge.bad{background:var(--bad-bg); border-color:#FBD5D5;} .badge.bad .val{color:var(--bad);}
  .badge.muted{background:var(--muted-bg); border-color:var(--border);} .badge.muted .val{color:var(--text2);}
  .card{border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; background:#fff;}
  .card .card-title{font-size:11.5px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
  .btn{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .btn.secondary{background:#fff; color:var(--accent); border:1px solid var(--accent-soft-border);}
  .btn.ghost{background:transparent; color:var(--text2); border:1px solid var(--border);}
  .btn.sm{padding:5px 9px; font-size:11.5px;}
  .empty-note{color:var(--text2); font-size:12.5px;}
  .tag-mini{font-size:9px; font-weight:700; padding:1px 5px; border-radius:4px; flex:none;}
  .tag-mini.muted-tag{background:var(--muted-bg); color:var(--text2); font-weight:600;}

  .ad-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .ad-header .ad-title{font-size:14px; font-weight:700;}
  .ad-header .ad-sub{font-size:12px; color:var(--text2); margin-top:2px;}
  .ad-close{border:1px solid var(--border); background:#fff; border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px; color:var(--text2); flex:none;}

  .mgr-switch{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .mgr-pill{border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; background:#fff; display:flex; align-items:center; gap:6px;}
  .mgr-pill.current{background:var(--accent); color:#fff; border-color:var(--accent);}
  .mgr-pill .agg{font-weight:800;}
  .mgr-scope-note{background:var(--bg-side); border:1px dashed var(--border); border-radius:8px; padding:8px 10px; font-size:11px; color:var(--text2); margin-bottom:12px;}
  .mgr-agg{display:flex; align-items:center; gap:12px; margin-bottom:16px; padding:14px; border-radius:var(--radius); border:1px solid var(--border);}
  .mgr-agg.ok{background:var(--ok-bg); border-color:#BBF0CE;}
  .mgr-agg.warn{background:var(--warn-bg); border-color:#FDE7B8;}
  .mgr-agg.bad{background:var(--bad-bg); border-color:#FBD5D5;}
  .mgr-agg.muted{background:var(--muted-bg); border-color:var(--border);}
  .mgr-agg .num{font-size:28px; font-weight:800;}
  .mgr-agg .lbl{font-size:12px; color:var(--text2);}
  .mgr-agg.bad .num, .mgr-agg.bad .lbl{color:var(--bad);}
  .mgr-agg.ok .num{color:var(--ok);}
  .mgr-agg.warn .num{color:var(--warn);}
  .mgr-agg.muted .num{color:var(--text2);}
  .mgr-tiles{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .mgr-tile{border:1px solid var(--border); border-radius:9px; padding:10px 12px; cursor:pointer; background:#fff;}
  .mgr-tile:hover{background:#F9FAFB;}
  .mgr-tile.selected{border-color:var(--accent); background:var(--accent-soft);}
  .mgr-tile .mt-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .mgr-tile .mt-label{font-size:12.5px; font-weight:700;}
  .mgr-tile .mt-pct{font-size:14px; font-weight:800;}
  .mgr-tile .mt-pct.ok{color:var(--ok);} .mgr-tile .mt-pct.warn{color:var(--warn);} .mgr-tile .mt-pct.bad{color:var(--bad);} .mgr-tile .mt-pct.muted{color:var(--text3);}
  .mgr-bar{height:6px; border-radius:4px; background:var(--muted-bg); overflow:hidden;}
  .mgr-bar-fill{height:100%; border-radius:4px;}
  .mgr-bar-fill.ok{background:var(--ok);} .mgr-bar-fill.warn{background:var(--warn);} .mgr-bar-fill.bad{background:var(--bad);}
  .mgr-tile .mt-n{font-size:10.5px; color:var(--text3); margin-top:4px;}
  .mgr-dialog-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .mgr-dialog-item{border:1px solid var(--border); border-radius:8px; padding:10px 12px; cursor:pointer; background:#fff;}
  .mgr-dialog-item:hover{background:#F9FAFB;}
  .mgr-dialog-item.selected{border-color:var(--accent); background:var(--accent-soft);}
  .mgr-dialog-item .mdi-top{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text2); margin-bottom:4px;}
  .mgr-dialog-item .mdi-excerpt{font-size:12.5px; color:var(--text);}
  .autofail-banner{background:var(--bad-bg); border:1px solid #FBD5D5; color:#9B1C1C; border-radius:var(--radius); padding:10px 12px; font-size:12.5px; font-weight:700; margin-bottom:14px;}

  /* ===== карточка менеджера — стиль взят с реального скрина CRM ===== */
  .wrap{max-width:720px; margin:0 auto; padding:22px 20px 60px; width:100%;}
  .mgr-card-v2{background:#fff; border:1px solid var(--border); border-radius:18px; padding:18px 20px; box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .mgr-card-top{display:flex; align-items:flex-start; gap:12px;}
  .avatar{width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#9B8CFB,var(--accent)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none;}
  .mgr-id-block .name{font-size:16px; font-weight:700; line-height:1.25;}
  .mgr-id-block .role{font-size:12.5px; color:var(--text2);}
  .mgr-card-spacer{flex:1;}
  .presence-block{text-align:right;}
  .status-pill-online{display:inline-flex; align-items:center; gap:5px; background:var(--ok-bg); color:var(--ok); font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .status-pill-online .dot{width:6px; height:6px; border-radius:50%; background:var(--ok);}
  .presence-time{font-size:11.5px; color:var(--text3); margin-top:4px;}
  .mgr-stats-row{display:flex; margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}
  .mgr-stat{flex:1; text-align:center; padding:0 8px; border-right:1px solid var(--border);}
  .mgr-stat:last-child{border-right:none;}
  .mgr-stat.clickable{cursor:pointer; border-radius:10px; padding-top:2px; padding-bottom:2px; transition:.12s;}
  .mgr-stat.clickable:hover{background:var(--bg-side);}
  .mgr-stat .stat-val{font-size:19px; font-weight:800; color:var(--text);}
  .mgr-stat .stat-val .ok{color:var(--ok);} .mgr-stat .stat-val .warn{color:var(--warn);} .mgr-stat .stat-val .bad{color:var(--bad);} .mgr-stat .stat-val .muted{color:var(--text3);}
  .mgr-stat .stat-lbl{font-size:11.5px; color:var(--text2); margin-top:3px;}
  .mgr-stat .chev{font-size:10px; color:var(--text3); margin-left:2px;}
  .activity-chart{position:relative; height:34px; margin:18px 4px 6px; border-bottom:1px solid var(--border);}
  .activity-bar{position:absolute; bottom:0; height:16px; background:var(--accent); border-radius:6px 6px 0 0; opacity:.85;}
  .activity-axis{display:flex; justify-content:space-between; font-size:11px; color:var(--text3); margin:0 4px;}
  .clients-toggle{text-align:center; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:13px; color:var(--text2); font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .clients-toggle:hover{color:var(--accent);}
  .clients-body{font-size:12px; color:var(--text3); text-align:center; padding:10px 4px 0;}
  .coverage-line{font-size:11px; color:var(--text3); margin-top:8px; text-align:center;}
  .drill-box{margin-top:14px;}
  .col.grow.standalone{border:1px solid var(--border); border-right:1px solid var(--border); border-radius:var(--radius); min-width:0;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>👤 Agent Scorecard</h1>
    <span class="sub">Overall score instead of a flat "politeness" figure · classes → instructions → the same 4.2 panel as the knowledge base editor</span>
    <span class="demo-banner">Demo · sample data derived from the public Bitext customer-support dataset</span>
  </div>
  <div class="wrap" id="wrap"></div>
</div>

<script>
/* ============ CLASSES (лёгкая копия структуры из v10 — те же id категорий,
   нужны только id/name, чтобы managerAnalysisPanelHtml/findCat работали
   без изменений на реальных id категорий) ============ */
/* ============ Category taxonomy + example dialogues sourced from the public
   Bitext customer-support dataset (CDLA-Sharing-1.0), remapped onto this
   product's class/instruction hierarchy. Not the real IZI project's data. ============ */
const CLASSES = [
  {id:"account", name:"Account", items:[
    {id:"create_account", name:"Create account", traffic:200},
    {id:"delete_account", name:"Delete account", traffic:200},
    {id:"edit_account", name:"Edit account", traffic:200},
    {id:"recover_password", name:"Recover password", traffic:200},
    {id:"registration_problems", name:"Registration problems", traffic:200},
    {id:"switch_account", name:"Switch account", traffic:200},
  ]},
  {id:"cancel", name:"Cancellations", items:[
    {id:"check_cancellation_fee", name:"Check cancellation fee", traffic:200},
  ]},
  {id:"contact", name:"Contact & Escalation", items:[
    {id:"contact_customer_service", name:"Contact customer service", traffic:200},
    {id:"contact_human_agent", name:"Contact human agent", traffic:200},
    {id:"support_hours_inquiry", name:"Support hours inquiry", traffic:19},
  ]},
  {id:"delivery", name:"Delivery", items:[
    {id:"delivery_options", name:"Delivery options", traffic:200},
    {id:"delivery_period", name:"Delivery period", traffic:200},
  ]},
  {id:"feedback", name:"Feedback", items:[
    {id:"complaint", name:"Complaint", traffic:200},
    {id:"formal_complaint_filing", name:"Formal complaint filing", traffic:32},
    {id:"review", name:"Review", traffic:200},
  ]},
  {id:"invoice", name:"Invoicing", items:[
    {id:"check_invoice", name:"Check invoice", traffic:200},
    {id:"get_invoice", name:"Get invoice", traffic:200},
  ]},
  {id:"order", name:"Orders", items:[
    {id:"cancel_order", name:"Cancel order", traffic:200},
    {id:"change_order", name:"Change order", traffic:200},
    {id:"place_order", name:"Place order", traffic:200},
    {id:"track_order", name:"Track order", traffic:200},
  ]},
  {id:"payment", name:"Payment", items:[
    {id:"check_payment_methods", name:"Check payment methods", traffic:200},
    {id:"payment_issue", name:"Payment issue", traffic:200},
  ]},
  {id:"refund", name:"Refunds", items:[
    {id:"check_refund_policy", name:"Check refund policy", traffic:200},
    {id:"get_refund", name:"Get refund", traffic:200},
    {id:"track_refund", name:"Track refund", traffic:200},
  ]},
  {id:"shipping", name:"Shipping", items:[
    {id:"change_shipping_address", name:"Change shipping address", traffic:200},
    {id:"set_up_shipping_address", name:"Set up shipping address", traffic:200},
  ]},
  {id:"subscription", name:"Subscriptions", items:[
    {id:"newsletter_subscription", name:"Newsletter subscription", traffic:200},
  ]},
];
const OTHER_BUCKET_TRAFFIC = 39; /* real count, straight from the pipeline: inquiries that landed in the
   uncategorized backlog and were NOT confidently promoted into a new category (see
   finalize_new_categories.py) -- not a placeholder number. */

/* ============ PRESENCE — cosmetic-only fields for the card header (status,
   avg close time, activity chart, clients). Does not affect scoring —
   mirrors the real CRM screenshot's non-scoring fields. Activity units are
   minutes from 08:00 within an 08:00-16:00 window (480 min), for bar %. ============ */
const PRESENCE = {
  aigerim:    {status:'online',  range:'09:09-11:33', duration:'2h 23m', avgClose:'1h 58m', closed:14, inProgress:2, clients:31,
    activity:[{start:65,width:38},{start:118,width:42},{start:172,width:36},{start:230,width:30}]},
  bermet:     {status:'online',  range:'08:45-12:10', duration:'3h 25m', avgClose:'1h 12m', closed:9, inProgress:1, clients:16,
    activity:[{start:20,width:50},{start:90,width:60},{start:175,width:55}]},
  cholpon:    {status:'offline', range:'09:30-11:05', duration:'1h 35m', avgClose:'2h 40m', closed:6, inProgress:2, clients:12,
    activity:[{start:95,width:45},{start:160,width:35}]},
  svetlana77: {status:'offline', range:'10:00-10:20', duration:'20m', avgClose:'-', closed:1, inProgress:1, clients:3,
    activity:[{start:130,width:20}]},
  sokolov:    {status:'online',  range:'08:15-13:40', duration:'5h 25m', avgClose:'1h 05m', closed:19, inProgress:0, clients:24,
    activity:[{start:10,width:55},{start:80,width:60},{start:155,width:50},{start:230,width:45},{start:300,width:35}]},
};

/* ============ Scoring engine constants — same methodology as the real
   project (weights, MIN_SAMPLE threshold, autofail rule), only the
   category data underneath is now sourced from a public dataset. ============ */
const CRITERIA_META = [
  {id:'accuracy',   label:'Accuracy & criticality',        canAutofail:true,  scoped:true},
  {id:'instruction', label:'Instruction compliance',        canAutofail:false, scoped:true},
  {id:'communication', label:'Communication',                canAutofail:false, scoped:false},
  {id:'speed',       label:'First response speed',           canAutofail:false, scoped:false},
  {id:'dataQuality', label:'Classification data quality',    canAutofail:false, scoped:false},
];
const CRITERIA_WEIGHTS = {accuracy:0.35, instruction:0.25, communication:0.20, speed:0.10, dataQuality:0.10};
const MIN_SAMPLE = 15;

const MANAGERS = [
  {id:"aigerim", name:"Aigerim", role:"Support Agent", sampleTotal:2198,
   criteria:{
     accuracy:{pct:76.0, n:2198, autofail:false, autofailCategories:[],
       byCategory:{
         "cancel_order":{pct:56.9, n:93, dialogs:[{client:"Tariq Murphy", date:'12.08', excerpt:"I'm trying to cancel purchase {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Hiro Haddad", date:'12.08', excerpt:"problem with cancelling purchase {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Jonas Larsen", date:'12.08', excerpt:"i need help canceling order {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Liam Kapoor", date:'12.08', excerpt:"where do I cancel purchase {{Order Number}}?", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Freya Bianchi", date:'12.08', excerpt:"help me cancel purchase {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Tariq Alves", date:'12.08', excerpt:"need help with canceling purchase {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}]},
         "change_order":{pct:55.9, n:86, dialogs:[{client:"Ines Alves", date:'12.08', excerpt:"i cant delete a prodcut from purchase {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Grace Larsen", date:'12.08', excerpt:"I have got to add a product to order {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Tariq Larsen", date:'12.08', excerpt:"help with adding a goddamn item to ordr {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Noor Zhang", date:'12.08', excerpt:"modifying purchase {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Noor Byrne", date:'12.08', excerpt:"want help to change something of order {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}, {client:"Noor Petrov", date:'12.08', excerpt:"change some items of order {{Order Number}}", responseTime:'-', quality:'n/a', tone:'neutral'}]},

function findManager(id){ return MANAGERS.find(m=>m.id===id); }
function scoreClass(pct){ if(pct===null) return 'muted'; if(pct>=80) return 'ok'; if(pct>=55) return 'warn'; return 'bad'; }
function managerAggregate(mgr, scope){
  const acc = mgr.criteria.accuracy;
  const autofail = (scope && scope.type==='category')
    ? !!(acc.autofailCategories && acc.autofailCategories.includes(scope.catId))
    : !!acc.autofail;
  if(autofail){ return {autofail:true, score:null}; }
  let sum=0, wsum=0;
  CRITERIA_META.forEach(c=>{
    const cr = mgr.criteria[c.id];
    const catData = (scope && scope.type==='category' && c.scoped) ? (cr.byCategory||{})[scope.catId] : null;
    const val = catData ? catData.pct : cr.pct;
    const n = catData ? catData.n : cr.n;
    if(val===null || val===undefined || n < MIN_SAMPLE) return;
    sum += val * CRITERIA_WEIGHTS[c.id];
    wsum += CRITERIA_WEIGHTS[c.id];
  });
  if(wsum===0) return {autofail:false, score:null};
  return {autofail:false, score: Math.round(sum/wsum)};
}
function managersForCategory(catId){
  return MANAGERS.filter(m => CRITERIA_META.some(c => (m.criteria[c.id].byCategory||{})[catId]));
}
function allCats(){ return CLASSES.flatMap(c => c.items.map(it => ({...it, classId:c.id, className:c.name}))); }
function findCat(id){ return allCats().find(c=>c.id===id); }
function findClass(id){ return CLASSES.find(c=>c.id===id); }

/* ============ НОВОЕ: свёртка снизу вверх — инструкция → класс → общая
   оценка. Использует managerAggregate() из v10 без изменений на каждой
   инструкции; добавляет только взвешенное усреднение по n и проброс ⚠
   по уровням (решения из обсуждения "практичные решения на практике") ============ */
function itemWeightN(mgr, catId){
  const cr = mgr.criteria.accuracy;
  const catData = (cr.byCategory||{})[catId];
  /* isReal=true only if the manager has an actual byCategory record for
     this instruction. Otherwise n is the manager's borrowed overall
     figure, not an observation about this specific category -- counting
     it as category-level volume would be false precision. */
  return catData ? {n: catData.n, isReal: true} : {n: cr.n, isReal: false};
}
function computeClassRollup(mgr, cls){
  const items = cls.items.map(it=>{
    const agg = managerAggregate(mgr, {type:'category', catId: it.id});
    const {n, isReal} = itemWeightN(mgr, it.id);
    return {...it, agg, n, isReal};
  });
  const scored = items.filter(it=>!it.agg.autofail && it.agg.score!==null);
  const totalN = items.reduce((s,it)=>s+it.n,0);
  const scoredN = scored.reduce((s,it)=>s+it.n,0);
  const classScore = scored.length ? Math.round(scored.reduce((s,it)=>s+it.agg.score*it.n,0)/scoredN) : null;
  const autofailCount = items.filter(it=>it.agg.autofail).length;
  const realItems = items.filter(it=>it.isReal);
  const realN = realItems.reduce((s,it)=>s+it.n,0);
  return {...cls, items, classScore, totalN, autofailCount, realCount:realItems.length, realN, itemCount: items.length};
}
function computeTopRollup(mgr){
  const classes = CLASSES.map(c=>computeClassRollup(mgr,c));
  const scoredClasses = classes.filter(c=>c.classScore!==null);
  const scoredN = scoredClasses.reduce((s,c)=>s+c.totalN,0);
  const topScore = scoredClasses.length ? Math.round(scoredClasses.reduce((s,c)=>s+c.classScore*c.totalN,0)/scoredN) : null;
  const autofailTotal = classes.reduce((s,c)=>s+c.autofailCount,0);
  const totalItems = classes.reduce((s,c)=>s+c.items.length,0);
  const realCount = classes.reduce((s,c)=>s+c.realCount,0);
  return {classes, topScore, autofailTotal, coverage:{total:totalItems, real:realCount}};
}

function selectMgrCard(id){

    state.cardOpen=false; state.classId=null; state.analysisPanel=null;
  } else {
    state.cardOpen=true;
  }
  render();
}
function openClass(id){ state.classId=id; state.analysisPanel=null; render(); }
function backToClasses(){ state.classId=null; state.analysisPanel=null; render(); }

/* Клик по инструкции — открывает ТОТ ЖЕ раздел 4.2, что и в Базе знаний ИИ:
   та же функция openAnalysisManagerForCategory + managerAnalysisPanelHtml,
   один в один. Единственное отличие от входа из Раздела 3 - если менеджер,
   чью карточку смотрим, есть среди кандидатов, панель открывается сразу на
   нём, а не на первом кандидате по умолчанию. */
function openInstructionAnalysis(catId){
  state.analysisPanel='manager';
  state.mgrScope = {type:'category', catId};
  const candidates = managersForCategory(catId);
  const preferred = candidates.find(m=>m.id===state.mgrId);
  state.mgrSelectedId = preferred ? preferred.id : (candidates.length ? candidates[0].id : null);
  state.mgrCritIdx = null; state.mgrDialogIdx = null;
  render();
}
function selectMgrManager(id){ state.mgrSelectedId=id; state.mgrCritIdx=null; state.mgrDialogIdx=null; render(); }
function selectMgrCrit(idx){ state.mgrCritIdx = (state.mgrCritIdx===idx) ? null : idx; state.mgrDialogIdx=null; render(); }
function selectMgrDialog(idx){ state.mgrDialogIdx = (state.mgrDialogIdx===idx) ? null : idx; render(); }
function closeAnalysis(){ state.analysisPanel=null; render(); }

/* ============ managerAnalysisPanelHtml + dialogListHtml — СКОПИРОВАНЫ ИЗ
   v10 БЕЗ ИЗМЕНЕНИЙ. Это буквально тот же раздел 4.2. ============ */
function dialogListHtml(dialogs){
  if(!dialogs || !dialogs.length) return `<div class="empty-note" style="margin-top:8px;">No conversation-level detail wired in for this tile yet -- the % and n above are already real, conversations get connected separately once there is something to point to.</div>`;
  return `<div class="mgr-dialog-list" style="margin-top:10px;">
    <div class="empty-note" style="margin-bottom:8px;">Real tickets for this category — topic and metadata, no full conversation text (source dataset has intent/response pairs, not a transcript). Illustrates volume, not the exact set the % was computed from.</div>
    ${dialogs.map((d,idx)=>{
    const open = state.mgrDialogIdx===idx;
    return `<div class="mgr-dialog-item ${open?'selected':''}" onclick="event.stopPropagation(); selectMgrDialog(${idx})">
      <div class="mdi-top"><span>${d.client}</span><span>${d.date}</span></div>
      <div class="mdi-excerpt">${d.excerpt}</div>
      ${open ? `<div style="padding:8px 0 0; border-top:1px dashed var(--border); margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
        <span class="tag-mini muted-tag">responded in ${d.responseTime}</span>
        <span class="tag-mini muted-tag">quality: ${d.quality}</span>
        <span class="tag-mini muted-tag">tone: ${d.tone}</span>
      </div>` : ''}
    </div>`;
  }).join('')}</div>`;
}
function managerAnalysisPanelHtml(){
  const scope = state.mgrScope;
  const cat = scope.type==='category' ? findCat(scope.catId) : null;
  const candidates = scope.type==='category' ? managersForCategory(scope.catId) : MANAGERS;

  if(!candidates.length){
    return `<div class="col grow standalone" id="colAnalysis">
      <div class="ad-header">
        <div><div class="ad-title">4.2 Agent Analysis</div><div class="ad-sub">${cat?cat.name:''}</div></div>
        <button class="ad-close" onclick="closeAnalysis()">✕</button>
      </div>
      <div class="empty-note">No agent data accumulated yet for this category -- same panel mechanics as the knowledge base editor, there just is not byCategory data for "${cat?cat.name:''}" in the sample data yet.</div>
    </div>`;
  }
  if(!state.mgrSelectedId) state.mgrSelectedId = candidates[0].id;
  const mgr = findManager(state.mgrSelectedId);
  const agg = managerAggregate(mgr, scope);

  const switchHtml = `<div class="mgr-switch">${candidates.map(m=>{
    const a = managerAggregate(m, scope);
    const lbl = a.autofail ? '⚠' : (a.score!==null ? a.score+'%' : '—');
    return `<span class="mgr-pill ${m.id===mgr.id?'current':''}" onclick="selectMgrManager('${m.id}')">${m.name} <span class="agg">${lbl}</span></span>`;
  }).join('')}</div>`;

  const aggHtml = agg.autofail
    ? `<div class="mgr-agg bad"><div class="num">⚠</div><div class="lbl">Auto-fail on "Accuracy & criticality"${scope.type==='category'?` specifically in the "${cat.name}" category`:''} — a critical error needs attention before the overall score</div></div>`
    : `<div class="mgr-agg ${scoreClass(agg.score)}"><div class="num">${agg.score!==null?agg.score+'%':'—'}</div><div class="lbl">Weighted score across 5 criteria${agg.score===null?' — insufficient data across all criteria':''}</div></div>`;

  const scopeNote = scope.type==='category'
    ? `<div class="mgr-scope-note">Showing agents and tickets for the "${cat.name}" category -- window: full accumulated history. Same panel that opens from the knowledge base editor.</div>`
    : '';

  const tilesHtml = CRITERIA_META.map((cm, idx)=>{
    const cr = mgr.criteria[cm.id];
    const catData = (scope.type==='category' && cm.scoped) ? (cr.byCategory||{})[scope.catId] : null;
    const pctToShow = catData ? catData.pct : (cr.n < MIN_SAMPLE ? null : cr.pct);
    const nToShow = catData ? catData.n : cr.n;
    const insufficient = nToShow < MIN_SAMPLE && !catData;
    const cls = insufficient ? 'muted' : scoreClass(pctToShow);
    const dialogs = catData ? catData.dialogs : [];
    const open = state.mgrCritIdx === idx;
    const tileAutofail = cm.canAutofail && cr.autofail && (scope.type!=='category' || (cr.autofailCategories||[]).includes(scope.catId));
    let noteText;
    if(insufficient){ noteText = `insufficient data (n=${nToShow}, threshold ${MIN_SAMPLE})`; }
    else if(!cm.scoped){ noteText = `n=${nToShow} -- behavioral criterion, overall figure, not category-specific`; }
    else if(catData){ noteText = `n=${nToShow} for the "${cat.name}" category`; }
    else { noteText = `n=${nToShow} across all categories -- no data specific to "${cat?cat.name:''}" yet`; }
    return `<div class="mgr-tile ${open?'selected':''}" onclick="selectMgrCrit(${idx})">
      <div class="mt-top">
        <span class="mt-label">${cm.label}${tileAutofail ? ' <span class="tag-mini" style="background:var(--bad-bg);color:var(--bad);">auto-fail</span>' : ''}</span>
        <span class="mt-pct ${cls}">${insufficient ? '—' : (pctToShow!==null?pctToShow+'%':'—')}</span>
      </div>
      <div class="mgr-bar"><div class="mgr-bar-fill ${cls==='muted'?'':cls}" style="width:${insufficient?0:(pctToShow||0)}%"></div></div>
      <div class="mt-n">${noteText}</div>
      ${open ? dialogListHtml(dialogs) : ''}
    </div>`;
  }).join('');

  return `<div class="col grow standalone" id="colAnalysis">
    <div class="ad-header">
      <div><div class="ad-title">4.2 Agent Analysis</div><div class="ad-sub">${cat?cat.name:'All categories'}</div></div>
      <button class="ad-close" onclick="closeAnalysis()">✕</button>
    </div>
    ${scopeNote}
    ${switchHtml}
    ${aggHtml}
    <div class="mgr-tiles">${tilesHtml}</div>
  </div>`;
}

        <div class="col-header"><span class="n">1</span>Classes</div>`;
      roll.classes.forEach(c=>{
        const dc = c.classScore===null ? 'muted' : scoreClass(c.classScore);
        const pctLabel = c.classScore!==null ? c.classScore+'%' : '—';
        html += `<div class="row-item" onclick="openClass('${c.id}')">
          <span class="dot ${dc}"></span>
          <span class="name">${c.name}<div class="class-sub">${c.realCount>0 ? `n=${c.realN} own (${c.realCount} of ${c.itemCount})` : 'no category-specific data -- overall figure used'}</div></span>
          ${c.autofailCount>0 ? `<span class="flag">⚠ ${c.autofailCount}</span>` : ''}
          <span class="meta">${pctLabel}</span>
        </div>`;
      });
      html += `<div class="row-item razno">
        <span class="dot muted"></span>
        <span class="name">Uncategorized<div class="class-sub">${OTHER_BUCKET_TRAFFIC} tickets -- real pipeline long tail, not force-fit into a category -- no per-agent score by design</div></span>
      </div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  document.getElementById('wrap').innerHTML = html;
}
render();
</script>
</body>
</html>
